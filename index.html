<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio: small tools, big time savers</title>
<meta name="description" content="Simple web tools that each solve one annoying problem, fast.">
<style>
  :root { --bg: #f7f7f4; --ink: #15171a; --muted: #5d6470; --card: #fff; --line: #e3e3dd; --accent: #2457d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111317; --ink: #eef0f3; --muted: #9aa3b2; --card: #191c22; --line: #2a2f38; --accent: #7aa2ff; } }
  * { box-sizing: border-box; } body { margin: 0; font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 880px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 8px; letter-spacing: -0.02em; } p.lede { color: var(--muted); margin: 0 0 32px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
  a.card { display: block; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); } .card b { display: block; margin-bottom: 4px; } .card span { color: var(--muted); font-size: .95rem; }
  footer { margin-top: 48px; color: var(--muted); font-size: .9rem; } footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Small tools. Big time savers.</h1>
  <p class="lede">Each tool solves one annoying problem, fast. Free to use; Pro when you want more.</p>
  <div class="grid" id="tools"><p class="lede">New tools are on the way.</p></div>
  <footer><a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></footer>
</main>
<script>
  fetch('/catalog/tools.json').then((r) => r.json()).then((c) => {
    if (!c.tools.length) return;
    document.getElementById('tools').innerHTML = c.tools.map((t) => `<a class="card" href="/${t.id}/"><b>${t.name.replace(/</g, '&lt;')}</b><span>${t.tagline.replace(/</g, '&lt;')}</span></a>`).join('');
  }).catch(() => {});
</script>
</body>
</html>
