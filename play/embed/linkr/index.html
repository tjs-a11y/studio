<style>
  /* A compact, self-contained widget: no account, no storage, no sound, no service worker. */
  body { background: var(--bg); }
  .wrap { max-width: 440px; padding: 12px 12px 14px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
  .head h1 { font-size: 1.2rem; margin: 0; }
  .head p { margin: 0; font-size: .82rem; color: var(--muted); }
  .board { --n: 5; position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; width: min(100%, 360px); margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .lt { position: relative; z-index: 1; aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: 800 clamp(1rem, 5.4vw, 1.45rem)/1 system-ui, sans-serif; cursor: pointer; padding: 0; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .lt.next { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .lt.on { background: var(--accent-soft); border-color: var(--accent); }
  .lt.head { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .lt .mk { position: absolute; font-size: .58rem; font-weight: 900; line-height: 1; }
  .lt .mk.s { top: 3px; left: 4px; background: var(--good); color: #fff; border-radius: 4px; padding: 2px 3px; }
  .lt .mk.f { top: 2px; right: 4px; font-size: .8rem; color: var(--bad); }
  .lt.head .mk.f { color: var(--on-accent); }
  .lt .mk.g { bottom: 2px; right: 4px; font-size: .75rem; color: var(--gold); }
  .trail { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .trail polyline { fill: none; stroke: var(--accent); stroke-width: .16; stroke-linecap: round; stroke-linejoin: round; }
  .hud { margin: 2px 0 6px; } .hud .stat b { font-size: 1.2rem; }
  .status { margin: 4px 0 8px; font-size: .95rem; }
  .tools { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .tools .btn { min-height: 44px; padding: 6px 14px; }
  .done { text-align: center; margin: 10px 0 0; }
  .back { display: block; text-align: center; margin: 12px 0 0; font-weight: 700; }
  .fine { text-align: center; font-size: .75rem; color: var(--muted); margin: 6px 0 0; }
</style>
<script defer src="/js/va.js"></script><script defer src="/_vercel/insights/script.js"></script>
</head>
<body data-game="linkr">
<main class="wrap">
  <div class="head"><h1 id="title">Today's Linkr</h1><p>Normal · same puzzle for everyone today</p></div>
  <p class="small muted" style="margin:0 0 6px">Draw a path from <b>S</b> to the flag. The numbers must add up to exactly the target, through the gem.</p>
  <div class="hud">
    <div class="stat"><b id="target">0</b><span>Target</span></div>
    <div class="stat"><b id="sum">0</b><span>Your sum</span></div>
    <div class="stat"><b id="time">0:00</b><span>Time</span></div>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="board" id="board"></div>
  <div class="tools"><button class="btn quiet" id="undo">↩ Undo</button><button class="btn quiet" id="reset">Restart</button></div>
  <p class="done" id="done" hidden></p>
  <a class="back" id="back" href="/play/?ref=embed" target="_blank" rel="noopener">Play more at Quickwell Play →</a>
  <p class="fine">Free daily brain games by Quickwell. Nothing is saved or tracked here.</p>
</main>
<script type="module" src="/play/js/embed-linkr.mjs"></script>
</body>
</html>
