name: IndexNow ping

# After each push to main, tell IndexNow search engines which pages exist.
# The site address comes from site.config.json (or the repo variable SITE_URL, which wins if set). Stays off
# while the address is still the placeholder. No account or secret is needed: the key file <32 hex>.txt sits at the site root.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the site address
        id: site
        run: |
          URL="${VARS_SITE_URL:-$(node -p "require('./site.config.json').origin")}"
          case "$URL" in *quickwell.example*|"") echo "Placeholder address: nothing to do."; URL="" ;; esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VARS_SITE_URL: ${{ vars.SITE_URL }}

      - name: Wait for the Vercel deployment
        if: steps.site.outputs.url != ''
        run: sleep 180

      - name: Check the key file is live
        if: steps.site.outputs.url != ''
        run: |
          KEY_FILE=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -n1)
          curl -fsS --retry 5 --retry-delay 30 --retry-all-errors "${SITE_URL%/}/${KEY_FILE}" > /dev/null
        env:
          SITE_URL: ${{ steps.site.outputs.url }}

      - name: Ping IndexNow
        if: steps.site.outputs.url != ''
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
