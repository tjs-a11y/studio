name: Usage metrics snapshot

# Once a day, read the public anonymous usage counts (GET /api/stats — integer counters only,
# no visitor, name or email) and commit them to metrics/ so the growth scoreboard can read real
# numbers from git. GitHub's runners can reach the live site; the family-office automation host
# gets 403 from it, which is why the snapshot is committed here rather than fetched at shift time.
# No secret or account is needed: /api/stats is public and returns {enabled:false} until KV is on.

on:
  schedule:
    - cron: '35 10 * * *'   # 10:35 UTC daily = 5:35 am Central (daylight) / 4:35 am (standard), before the Morning Brief
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quickwell-metrics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and write snapshot
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/stats-snapshot.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet && echo "No change." && exit 0
          git commit -m "Usage metrics snapshot: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
