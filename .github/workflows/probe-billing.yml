name: Probe billing (one-off)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe pages + checkout
        run: |
          echo "== /js/pro.js =="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://quickwell.app/js/pro.js
          echo "== /vigless/ wiring (count of pro markers) =="
          curl -sS https://quickwell.app/vigless/ | grep -oE 'pro\.js|id="pro-section"|Unlock Pro|up-month' | sort | uniq -c || true
          for t in vigless tradepath fuelgauge; do
            if [ "$t" = "fuelgauge" ]; then plan=pro-mid; else plan=pro; fi
            echo "== POST /api/checkout tool=$t plan=$plan interval=month =="
            curl -sS -X POST https://quickwell.app/api/checkout \
              -H 'content-type: application/json' \
              -d "{\"tool\":\"$t\",\"plan\":\"$plan\",\"interval\":\"month\"}" ; echo
          done
          echo "== /api/health =="
          curl -sS https://quickwell.app/api/health ; echo
