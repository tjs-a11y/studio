<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quickwell external-origin embed test fixture</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;margin:20px}
iframe{display:block;width:100%;height:900px;border:1px solid #999}
#status{padding:10px;border:1px solid #aaa}
</style>
</head>
<body>
<h1>External-origin embed fixture</h1>
<p>This page is intended to be served from a host other than quickwell.app.</p>
<p id="status" role="status" aria-live="polite">Waiting for the embedded route to send a resize message…</p>
<iframe id="fixture-frame" title="Quickwell embed external-origin test" loading="eager"></iframe>
<script>
(function(){
 'use strict';
 var params=new URLSearchParams(location.search);
 var src=params.get('src');
 var status=document.getElementById('status');
 var frame=document.getElementById('fixture-frame');
 var target;
 try{target=new URL(src);}catch(e){status.textContent='FAIL: provide a valid src query parameter.';return;}
 if(target.protocol!=='https:'||!(target.hostname==='quickwell.app'||target.hostname.endsWith('.vercel.app'))){
  status.textContent='FAIL: src must use Quickwell production or a Vercel preview host.';
  return;
 }
 var parts=target.pathname.split('/').filter(Boolean);
 var tool=parts[1];
 if(parts[0]!=='embed'||!['bill-radar','fair-price','dinner','rate-con-checker'].includes(tool)){
  status.textContent='FAIL: src must be one of the four dedicated embed routes.';
  return;
 }
 var received=false;
 var timeout=window.setTimeout(function(){
  if(received)return;
  status.textContent='FAIL: no verified resize handshake; the frame may be blocked by CSP/X-Frame-Options or the embed route did not initialize.';
 },15000);
 frame.addEventListener('load',function(){if(!received)status.textContent='Frame loaded; waiting for the resize handshake…';});
 frame.src=target.href;
 window.addEventListener('message',function(event){
  if(event.origin!==target.origin||event.source!==frame.contentWindow)return;
  var data=event.data;
  if(!data||data.type!=='quickwell:embed:resize'||data.tool!==tool)return;
  var height=Number(data.height);
  if(!Number.isFinite(height))return;
  received=true;
  window.clearTimeout(timeout);
  frame.style.height=Math.max(520,Math.min(3000,Math.ceil(height)))+'px';
  status.textContent='PASS: external-origin embed sent a verified resize message for '+tool+' ('+frame.style.height+').';
 });
})();
</script>
</body>
</html>
